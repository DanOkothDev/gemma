name: rxguard-hermes
region: nyc
services:
  - name: rxguard-web
    github:
      branch: main
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_MODEL_ACCESS_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_INFERENCE_ENDPOINT
        value: https://inference.do-ai.run/v1
      - key: DO_INFERENCE_MODEL
        value: llama-3.3-70b-instruct
